<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的網頁</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --fg: #1f2328;
      --muted: #6b7280;
      --accent: #2563eb;
      --card: #ffffff;
      --border: #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181c;
        --fg: #e6e8eb;
        --muted: #9aa1ab;
        --accent: #60a5fa;
        --card: #1f2227;
        --border: #2d3139;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
    }
    header, main, footer {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 20px;
    }
    header { padding-top: 64px; padding-bottom: 32px; }
    h1 { font-size: 2.2rem; margin: 0 0 8px; }
    .subtitle { color: var(--muted); margin: 0; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 16px;
    }
    .card h2 { margin: 0 0 8px; font-size: 1.2rem; }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    #count { font-weight: 600; margin-left: 12px; }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .gallery img {
      width: 100%;
      aspect-ratio: 9 / 16;
      object-fit: cover;
      border-radius: 8px;
      cursor: zoom-in;
      display: block;
      background: var(--border);
    }
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      cursor: zoom-out;
    }
    .lightbox[hidden] { display: none; }
    .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
    footer { color: var(--muted); font-size: 0.9rem; padding-top: 32px; padding-bottom: 48px; }
  </style>
</head>
<body>
  <header>
    <h1>哈囉，歡迎光臨 👋</h1>
    <p class="subtitle">這是一個簡單的網頁範例。</p>
  </header>

  <main>
    <section class="card">
      <h2>關於</h2>
      <p>你可以在這裡介紹自己、你的專案，或任何想分享的內容。</p>
    </section>

    <section class="card">
      <h2>小互動</h2>
      <button id="btn">點我</button>
      <span id="count">已點擊 0 次</span>
    </section>

    <section class="card">
      <h2>相簿</h2>
      <div class="gallery" id="gallery"></div>
    </section>
  </main>

  <div class="lightbox" id="lightbox" hidden>
    <img id="lightbox-img" alt="">
  </div>

  <footer>
    © <span id="year"></span> 我的網頁
  </footer>

  <script>
    let clicks = 0;
    document.getElementById('btn').addEventListener('click', () => {
      clicks++;
      document.getElementById('count').textContent = `已點擊 ${clicks} 次`;
    });
    document.getElementById('year').textContent = new Date().getFullYear();

    const photos = [
      'DF85DC81-DE0B-4D60-9F1C-4B9CFFBE41A7_4_5005_c.jpeg',
      'D9854503-AE61-442A-AC73-40313DC9FAF1_4_5005_c.jpeg',
      '27CFDEE1-7702-457A-B01B-FA2167C8FA24_4_5005_c.jpeg',
      '6AFAFA0D-1F48-4595-AC90-513FB29DD0A9_4_5005_c.jpeg',
      '48D981C9-821D-4089-AD7B-B60A5E1DA929_4_5005_c.jpeg',
      'F13D531C-728D-4283-AFA2-9CF7F87D0837_4_5005_c.jpeg',
      'F99A1EA4-16BF-4A69-A775-E0B074CE8144_4_5005_c.jpeg',
      'EFD1C2E6-434A-40BA-A423-B286AA1AF94C_4_5005_c.jpeg',
      'A16A9F1F-F754-41F8-9705-2A41C4DD006C_4_5005_c.jpeg',
      '594B9DBF-0667-4F47-BE1F-5ED1481CE3E4_4_5005_c.jpeg',
    ];
    const gallery = document.getElementById('gallery');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    photos.forEach((name, i) => {
      const img = document.createElement('img');
      img.src = `assests/${name}`;
      img.alt = `相片 ${i + 1}`;
      img.loading = 'lazy';
      img.addEventListener('click', () => {
        lightboxImg.src = img.src;
        lightboxImg.alt = img.alt;
        lightbox.hidden = false;
      });
      gallery.appendChild(img);
    });
    lightbox.addEventListener('click', () => { lightbox.hidden = true; });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') lightbox.hidden = true;
    });
  </script>
</body>
</html>
